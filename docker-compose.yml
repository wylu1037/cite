# 内网部署：docker compose up -d --build
# 首次部署前：mkdir -p data/content && cp -r content/* data/content/  （种子内容）
services:
  web:
    build: .
    restart: unless-stopped
    command: ['sh', '-c', 'node scripts/migrate.mjs && node server.js']
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://kb:kb@db:5432/kb
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置}
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-http://172.31.11.11:3127/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-EMPTY}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-dsv4}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-http://172.31.11.10:8081/v1/embeddings}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-Qwen3-Embedding-8B}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-4096}
    volumes:
      - ./data/content:/app/content
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: kb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kb']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
